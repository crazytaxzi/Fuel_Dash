name: Publish Fuel Dash patch release

on:
  push:
    branches:
      - main
    paths:
      - .github/stable-release-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-stable-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < .github/stable-release-request.txt)"
          if [[ ! "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=Fuel_Dash-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            app.js
            smart_data_loader.js
            auxiliary_mode.js
            missing_bol.js
            missing_bol_driver_only.js
            worked_workflow.js
            note_transition_toggle.js
            transition_export_v2.js
            database/dashboard-db.js
            database/bootstrap.js
            database/pta-history-ui.js
            database/pta-change-worker.js
            database/worked-navigation-fix.js
          )
          for script in "${scripts[@]}"; do
            if [[ -f "$script" ]]; then
              node --check "$script"
            fi
          done

      - name: Build downloadable ZIP
        shell: python
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place the current XLSX and PDF operating reports in this folder.\n"
              "PTA snapshots, notes, and history remain in the local browser database and are not included in this package.\n",
              encoding="utf-8",
          )

          version = os.environ["RELEASE_VERSION"]
          commit = os.environ["RELEASE_SHA"]
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: {version}\nCommit: {commit}\n"
              "Data storage: local browser IndexedDB only; no operational records are bundled or shared.\n",
              encoding="utf-8",
          )

          zip_path = dist / os.environ["RELEASE_ASSET"]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          checksum = dist / f"{zip_path.name}.sha256"
          checksum.write_text(f"{digest}  {zip_path.name}\n", encoding="ascii")

          notes = dist / "release-notes.md"
          notes.write_text(
              f"# Fuel Dash {version}\n\n"
              "## Fixed\n\n"
              "- Worked PTA entries now open the matching truck modal even when the truck is hidden by the current PTA filter.\n"
              "- The original PTA filter is restored after opening the entry.\n"
              "- If a truck or driver is no longer in the current report, the saved follow-up opens in a local history popup instead of redirecting to another tab.\n\n"
              "## Privacy\n\n"
              "Operational PTA data and notes are not included in this release and are not uploaded to GitHub. They remain in the browser profile on the computer running the dashboard.\n\n"
              "## Install\n\n"
              "Download the ZIP, extract it, place current report files in the `data` folder, and run `Launch Fuel Dashboard.cmd`.\n",
              encoding="utf-8",
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists." >&2
            exit 1
          fi
          gh release create "$VERSION" \
            "dist/$ASSET" \
            "dist/$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fuel Dash $VERSION" \
            --notes-file dist/release-notes.md

      - name: Record release success
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n%s\n' "$VERSION" "$ASSET" "$GITHUB_SHA" > .github/stable-release-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stable-release-result.txt
          git commit -m "Record stable release $VERSION"
          git push origin main
