name: Remove transition email backgrounds and publish v3.13.2

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - .github/transition-no-background-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-transition-no-background
  cancel-in-progress: false

jobs:
  migrate-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Migrate rich editor and remove email backgrounds
        shell: python
        run: |
          from pathlib import Path
          import base64
          import json
          import re
          import shutil
          import subprocess

          root = Path.cwd()
          bundle = root / "database" / "rich-transition-patch"
          parts = [bundle / f"part-{index:02d}.b64" for index in range(5)]
          missing = [str(path) for path in parts if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing rich transition bundle parts: {missing}")

          encoded = "".join("".join(path.read_text(encoding="utf-8").split()) for path in parts)
          source = base64.b64decode(encoded, validate=True).decode("utf-8")

          if "function removeEmailBackgrounds(" in source:
              raise SystemExit("Background-removal migration already exists")

          sanitize_pattern = re.compile(
              r"(?m)^(?P<indent>\s*)function sanitizeHtml\((?P<arg>[$A-Za-z_][$A-Za-z0-9_]*)\)\s*\{"
          )
          sanitize_match = sanitize_pattern.search(source)
          if not sanitize_match:
              raise SystemExit("Could not locate sanitizeHtml")

          indent = sanitize_match.group("indent")
          arg = sanitize_match.group("arg")
          replacement = f'''{indent}function sanitizeHtml({arg}) {{
          {indent}  return removeEmailBackgrounds(sanitizeHtmlBase({arg}));
          {indent}}}

          {indent}function removeEmailBackgrounds(html) {{
          {indent}  const container = document.createElement("div");
          {indent}  container.innerHTML = String(html ?? "");
          {indent}  const readableColors = {{
          {indent}    "#fff": "#172033",
          {indent}    "#ffffff": "#172033",
          {indent}    "white": "#172033",
          {indent}    "#a9f3c0": "#475467",
          {indent}    "#d8e1ec": "#667085",
          {indent}  }};
          {indent}  container.querySelectorAll("*").forEach((element) => {{
          {indent}    element.style.removeProperty("background");
          {indent}    element.style.removeProperty("background-color");
          {indent}    element.style.removeProperty("background-image");
          {indent}    element.removeAttribute("bgcolor");
          {indent}    element.removeAttribute("background");
          {indent}    const color = String(element.style.color || "").trim().toLowerCase();
          {indent}    if (readableColors[color]) element.style.color = readableColors[color];
          {indent}  }});
          {indent}  return stripEmailBackgroundCss(container.innerHTML);
          {indent}}}

          {indent}function stripEmailBackgroundCss(value) {{
          {indent}  return String(value ?? "")
          {indent}    .replace(/(?:background(?:-color|-image)?)\\s*:[^;\"']*;?/gi, "")
          {indent}    .replace(/\\s(?:bgcolor|background)\\s*=\\s*([\"']).*?\\1/gi, "");
          {indent}}}

          {indent}function sanitizeHtmlBase({arg}) {{'''
          source = source[:sanitize_match.start()] + replacement + source[sanitize_match.end():]

          outlook_pattern = re.compile(
              r"(?m)^(?P<indent>\s*)function outlookDocument\((?P<arg>[$A-Za-z_][$A-Za-z0-9_]*)\)\s*\{"
          )
          outlook_match = outlook_pattern.search(source)
          if outlook_match:
              outlook_indent = outlook_match.group("indent")
              outlook_arg = outlook_match.group("arg")
              outlook_replacement = f'''{outlook_indent}function outlookDocument({outlook_arg}) {{
          {outlook_indent}  return stripEmailBackgroundCss(outlookDocumentBase({outlook_arg}));
          {outlook_indent}}}

          {outlook_indent}function outlookDocumentBase({outlook_arg}) {{'''
              source = source[:outlook_match.start()] + outlook_replacement + source[outlook_match.end():]

          editor_path = root / "database" / "rich-transition-editor.js"
          editor_path.write_text(source, encoding="utf-8")

          loader = '''(() => {
            "use strict";

            window.VixenRichTransitionReady = new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.async = false;
              script.src = "database/rich-transition-editor.js";
              script.onload = () => resolve();
              script.onerror = () => reject(new Error("The rich transition composer could not start."));
              document.head.appendChild(script);
            });
          })();
          '''
          (root / "transition_export_v2.js").write_text(loader, encoding="utf-8")

          manifest = {
              "version": "3.13.2",
              "source": "database/rich-transition-editor.js",
              "emailBackgrounds": "removed at sanitize and Outlook document render time",
              "savedTemplates": "existing browser-saved templates are migrated during rendering",
              "features": [
                  "Bold", "Italic", "Underline", "Emoji picker",
                  "Rich Outlook clipboard copy", "Multipart HTML .eml export"
              ],
          }
          (root / "database" / "rich-transition-editor.manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )

          shutil.rmtree(bundle)
          (root / "VERSION").write_text("3.13.2\n", encoding="utf-8")
          (root / ".github" / "release-request.txt").write_text("v3.13.2\n", encoding="utf-8")

          for script in [editor_path, root / "transition_export_v2.js", root / "database" / "bootstrap.js", root / "app.js"]:
              subprocess.run(["node", "--check", str(script)], check=True)

          checks = [
              "function removeEmailBackgrounds(",
              'removeProperty("background")',
              'removeProperty("background-color")',
              'removeAttribute("bgcolor")',
              "function stripEmailBackgroundCss(",
          ]
          for check in checks:
              if check not in source:
                  raise SystemExit(f"Missing background-removal check: {check}")

          print(f"Created {editor_path} with {len(source.encode('utf-8'))} bytes")

      - name: Commit migrated editor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION .github/release-request.txt transition_export_v2.js database
          git commit -m "Remove transition email backgrounds"
          git push origin main

      - name: Build v3.13.2 package
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import zipfile

          root = Path.cwd()
          subprocess.run(["git", "pull", "--ff-only", "origin", "main"], check=True)
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place current XLSX and PDF reports in this folder. Operational notes and settings remain in the local browser.\n",
              encoding="utf-8",
          )

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: v3.13.2\nCommit: {commit}\n",
              encoding="utf-8",
          )

          zip_path = dist / "Fuel_Dash-v3.13.2.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / "Fuel_Dash-v3.13.2.zip.sha256").write_text(
              f"{digest}  Fuel_Dash-v3.13.2.zip\n", encoding="ascii"
          )
          (dist / "release-notes.md").write_text(
              "# Fuel Dash v3.13.2\n\n"
              "Removes background colors and background images from transition emails, including previously saved browser templates. "
              "Light header text is converted to readable dark text when its former background is removed.\n\n"
              "Bold, italic, underline, emoji, rich Outlook copy, and HTML .eml export remain available.\n",
              encoding="utf-8",
          )

      - name: Publish v3.13.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"
          gh release create v3.13.2 \
            dist/Fuel_Dash-v3.13.2.zip \
            dist/Fuel_Dash-v3.13.2.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Fuel Dash v3.13.2" \
            --notes-file dist/release-notes.md \
            --latest
