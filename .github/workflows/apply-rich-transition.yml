name: Apply rich transition editor

on:
  push:
    branches: [main]
    paths:
      - .github/apply-rich-transition.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble tested editor
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rich-transition-patch/part-*.b64 | base64 --decode > transition_export_v2.js
          echo "187d00de65db2a8c2d01353d9cde4ea2e4b2be534997d8dc97adc426511ea0ff  transition_export_v2.js" | sha256sum --check --strict

      - name: Validate rich email behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check transition_export_v2.js
          grep -F 'data-editor-command="bold"' transition_export_v2.js
          grep -F 'data-editor-command="italic"' transition_export_v2.js
          grep -F 'data-editor-command="underline"' transition_export_v2.js
          grep -F '😊 Emotes' transition_export_v2.js
          grep -F 'ClipboardItem' transition_export_v2.js
          grep -F 'multipart/alternative' transition_export_v2.js
          grep -F 'Content-Type: text/html' transition_export_v2.js
          grep -F 'transition-email-sheet' transition_export_v2.js

      - name: Version and document feature
        shell: python
        run: |
          from pathlib import Path

          Path("VERSION").write_text("3.13.0\n", encoding="utf-8")
          workflow_path = Path(".github/workflows/publish-v3-release.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old = '- Transition Email Editor with saved Outlook recipients and templates, editable preview, mail-app launch, .eml download, and copy controls'
          new = '- Rich Outlook transition editor with readable HTML sections, bold/italic/underline controls, emoji picker, rich clipboard copy, multipart .eml download, and plain-text fallback'
          if old not in workflow:
              raise SystemExit("Release-note transition bullet was not found")
          workflow_path.write_text(workflow.replace(old, new, 1), encoding="utf-8")

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transition_export_v2.js VERSION .github/workflows/publish-v3-release.yml
          git commit -m "Add rich Outlook transition editor"
          git push origin main
