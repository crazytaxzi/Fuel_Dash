name: Apply four-week idle history

on:
  push:
    branches: [main]
    paths:
      - .github/apply-idle-history.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add four-week idle charts
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8")
          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              '  const state = {\n',
              '  window.VixenIdleHistory = Object.freeze({ buildFleetIdleTrend });\n\n  const state = {\n',
              "idle history API",
          )

          app = replace_once(
              app,
              '      "topDriversList", "bestIdlersList", "unitWatchList", "qualityAlerts", "nextActions", "trendWeekTotal", "trendWeekDelta",\n',
              '      "topDriversList", "bestIdlersList", "unitWatchList", "qualityAlerts", "nextActions", "trendWeekTotal", "trendWeekDelta",\n      "heroChartHeading", "heroCalloutLabel", "trendTotalLabel",\n',
              "chart labels cache",
          )

          old_trend = '''    const week = {
              date: latestDate,
              compliance,
              gallonCost: detail.totals.grossPositive,
              locationCost: 0,
              totalCost: detail.totals.netCost,
            };
            const trend = { weeks: [week], recent: [week], latest: week, previous: null, change: null, rollingAverage: [week.totalCost] };'''
          new_trend = '''    const idleWeeks = buildFleetIdleTrend(rolling7, rolling28, 4);
            if (!idleWeeks.length) {
              const eligible = drivers.records.filter((driver) => !driver.idleExcluded);
              const idle7Values = eligible.map((driver) => driver.idle7DayPct).filter(isFiniteNumber);
              const idle28Values = eligible.map((driver) => driver.idle28DayPct).filter(isFiniteNumber);
              idleWeeks.push({
                date: latestDate,
                idle7DayPct: idle7Values.length ? average(idle7Values) : null,
                idle28DayPct: idle28Values.length ? average(idle28Values) : null,
                idle7DriverCount: idle7Values.length,
                idle28DriverCount: idle28Values.length,
              });
            }
            const idleLatest = idleWeeks.at(-1) || null;
            const idlePrevious = idleWeeks.at(-2) || null;
            const trend = {
              metric: "idle",
              weeks: idleWeeks,
              recent: idleWeeks,
              latest: idleLatest,
              previous: idlePrevious,
              change: idleLatest && idlePrevious && isFiniteNumber(idleLatest.idle7DayPct) && isFiniteNumber(idlePrevious.idle7DayPct)
                ? idleLatest.idle7DayPct - idlePrevious.idle7DayPct
                : null,
              rollingAverage: idleWeeks.map((_, index) => {
                const values = idleWeeks.slice(Math.max(0, index - 3), index + 1).map((week) => week.idle7DayPct).filter(isFiniteNumber);
                return values.length ? average(values) : null;
              }),
            };'''
          app = replace_once(app, old_trend, new_trend, "idle trend stub")

          helper = '''  function buildFleetIdleTrend(rolling7, rolling28, limit = 4) {
            const byDate = new Map();
            const addPoint = (date, field, value) => {
              if (!(date instanceof Date) || Number.isNaN(date.getTime()) || !isFiniteNumber(value)) return;
              const key = dateKey(date);
              if (!byDate.has(key)) byDate.set(key, { date, idle7: [], idle28: [] });
              byDate.get(key)[field].push(value);
            };
            const isExcludedHistory = (record) => {
              const embeddedCode = text(record?.driverName).match(/^\\s*(\\d{4,})\\b/)?.[1] || "";
              return isIdleExcludedDriver({ driverName: record?.driverName || "", driverCode: embeddedCode });
            };

            rolling7.forEach((record) => {
              if (isExcludedHistory(record)) return;
              (record.history || []).forEach((point) => addPoint(point.date, "idle7", point.idlePct));
            });
            rolling28.forEach((record) => {
              if (isExcludedHistory(record)) return;
              (record.history || []).forEach((point) => addPoint(point.date, "idle28", point.idlePct));
            });

            return [...byDate.values()]
              .sort((a, b) => a.date - b.date)
              .slice(-Math.max(1, limit))
              .map((entry) => ({
                date: entry.date,
                idle7DayPct: entry.idle7.length ? average(entry.idle7) : null,
                idle28DayPct: entry.idle28.length ? average(entry.idle28) : null,
                idle7DriverCount: entry.idle7.length,
                idle28DriverCount: entry.idle28.length,
              }));
          }

'''
          app = replace_once(
              app,
              '  function parseRolling7DayReport(workbook) {\n',
              helper + '  function parseRolling7DayReport(workbook) {\n',
              "fleet idle history helper",
          )

          app = replace_once(
              app,
              '    const costChange = trend.change;\n',
              '    const costChange = trend.metric === "idle" ? null : trend.change;\n',
              "cost change guard",
          )

          old_hero = '''    const topDriver = isIdleFocusedMode(analysis) ? highestIdlers[0] : drivers.records[0];
            els.heroInsight.innerHTML = topDriver
              ? analysis.sourceMode === "idle-reports"
                ? `<strong>Current idle review.</strong> ${escapeHtml(topDriver.driverName)} has the highest current 7-day idle at <strong>${pct(topDriver.idle7DayPct, 1)}</strong>, compared with ${pct(topDriver.idle28DayPct, 1)} over 28 days.`
                : analysis.sourceMode === "basic-reports"
                  ? `<strong>Basic XLSX/PDF report mode.</strong> ${escapeHtml(topDriver.driverName)} is first in the idle/MPG review order. ${escapeHtml(topDriver.focus)}. Transaction-level driver cost is not included in these reports.`
                  : `${escapeHtml(topDriver.driverName)} has the largest estimated cost gap to review. ${escapeHtml(topDriver.focus)}. The dashboard estimates <strong>${moneyCompact(topDriver.estimatedCost)}</strong> in possible 28-day savings if performance reaches the strong-peer target. Fleet-wide possible savings are <strong>${moneyCompact(drivers.totals.modeledCost)}</strong>.`
              : "No estimated driver cost gap was found.";
            els.heroSavings.textContent = moneyCompact(drivers.totals.modeledCost);'''
          new_hero = '''    const topDriver = isIdleFocusedMode(analysis) ? highestIdlers[0] : drivers.records[0];
            const idleLatest = trend.metric === "idle" ? trend.latest : null;
            const idlePrevious = trend.metric === "idle" ? trend.previous : null;
            const idlePointChange = idleLatest && idlePrevious && isFiniteNumber(idleLatest.idle7DayPct) && isFiniteNumber(idlePrevious.idle7DayPct)
              ? idleLatest.idle7DayPct - idlePrevious.idle7DayPct
              : null;
            const idleDirection = idlePointChange === null
              ? "No prior-week comparison is available"
              : `${idlePointChange > 0 ? "up" : idlePointChange < 0 ? "down" : "flat"} ${Math.abs(idlePointChange * 100).toFixed(1)} percentage points from the prior week`;
            els.heroInsight.innerHTML = topDriver
              ? analysis.sourceMode === "idle-reports"
                ? `<strong>Four-week idle history.</strong> Fleet 7-day idle is <strong>${pct(idleLatest?.idle7DayPct, 1)}</strong>, ${escapeHtml(idleDirection)}. The 28-day fleet measure is ${pct(idleLatest?.idle28DayPct, 1)}. ${escapeHtml(topDriver.driverName)} is the highest current eligible driver at <strong>${pct(topDriver.idle7DayPct, 1)}</strong>.`
                : analysis.sourceMode === "basic-reports"
                  ? `<strong>Basic XLSX/PDF report mode.</strong> ${escapeHtml(topDriver.driverName)} is first in the idle/MPG review order. ${escapeHtml(topDriver.focus)}. Transaction-level driver cost is not included in these reports.`
                  : `${escapeHtml(topDriver.driverName)} has the largest estimated cost gap to review. ${escapeHtml(topDriver.focus)}. The dashboard estimates <strong>${moneyCompact(topDriver.estimatedCost)}</strong> in possible 28-day savings if performance reaches the strong-peer target. Fleet-wide possible savings are <strong>${moneyCompact(drivers.totals.modeledCost)}</strong>.`
              : "No estimated driver cost gap was found.";
            if (els.heroChartHeading) els.heroChartHeading.textContent = trend.metric === "idle" ? "FLEET IDLE HISTORY" : "EXTRA COST TREND";
            if (els.heroCalloutLabel) els.heroCalloutLabel.textContent = trend.metric === "idle" ? "CURRENT 7-DAY IDLE" : "POSSIBLE 28-DAY SAVINGS";
            if (els.trendTotalLabel) els.trendTotalLabel.textContent = trend.metric === "idle" ? "CURRENT 7-DAY IDLE" : "WEEK TOTAL";
            els.heroSavings.textContent = trend.metric === "idle" ? pct(trend.latest?.idle7DayPct, 1) : moneyCompact(drivers.totals.modeledCost);'''
          app = replace_once(app, old_hero, new_hero, "hero insight")

          app = replace_once(
              app,
              '''    els.trendWeekTotal.textContent = trend.latest ? moneyCompact(trend.latest.totalCost) : "--";
              els.trendWeekDelta.textContent = trend.change === null ? "No comparison" : deltaLabel(trend.change, "vs prior", false);''',
              '''    if (trend.metric === "idle") {
              els.trendWeekTotal.textContent = pct(trend.latest?.idle7DayPct, 1);
              els.trendWeekDelta.textContent = trend.change === null
                ? "No comparison"
                : `${trend.change >= 0 ? "▲" : "▼"} ${Math.abs(trend.change * 100).toFixed(1)} pts vs prior`;
            } else {
              els.trendWeekTotal.textContent = trend.latest ? moneyCompact(trend.latest.totalCost) : "--";
              els.trendWeekDelta.textContent = trend.change === null ? "No comparison" : deltaLabel(trend.change, "vs prior", false);
            }''',
              "weekly trend summary",
          )

          old_charts = '''  function renderCharts(trend) {
            const labels = trend.weeks.map((week) => shortDate(week.date));
            const actual = trend.weeks.map((week) => week.totalCost);
            const rolling = trend.rollingAverage;

            if (state.heroChart) state.heroChart.destroy();
            state.heroChart = new Chart($("heroChart"), {
              type: "line",
              data: {
                labels,
                datasets: [
                  { label: "Actual Cost", data: actual, borderColor: "#b55cff", backgroundColor: "rgba(168,85,247,.2)", fill: true, tension: .28, pointRadius: 3, pointBackgroundColor: "#d9a2ff", borderWidth: 2 },
                  { label: "4-Week Avg", data: rolling, borderColor: "#39ff63", backgroundColor: "transparent", borderDash: [7,5], tension: .25, pointRadius: 0, borderWidth: 2 },
                ],
              },
              options: chartOptions({ legend: true, compact: false }),
            });

            if (state.weeklyChart) state.weeklyChart.destroy();
            state.weeklyChart = new Chart($("weeklyChart"), {
              type: "line",
              data: {
                labels,
                datasets: [
                  { label: "Total", data: actual, borderColor: "#b55cff", backgroundColor: "rgba(168,85,247,.14)", fill: true, tension: .3, pointRadius: 3, borderWidth: 2 },
                  { label: "Location", data: trend.weeks.map((week) => week.locationCost), borderColor: "#39ff63", borderDash: [6,4], tension: .25, pointRadius: 0, borderWidth: 2 },
                ],
              },
              options: chartOptions({ legend: true, compact: true }),
            });
          }

          function chartOptions({ legend, compact }) {
            return {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              plugins: {
                legend: { display: legend, position: "top", align: "start", labels: { boxWidth: 9, boxHeight: 9, font: { size: 9 }, padding: 12 } },
                tooltip: { backgroundColor: "rgba(4,9,13,.95)", borderColor: "rgba(168,85,247,.5)", borderWidth: 1, callbacks: { label: (context) => `${context.dataset.label}: ${money(context.parsed.y, 2)}` } },
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: compact ? 8 : 9 }, maxRotation: 0 } },
                y: { grid: { color: "rgba(255,255,255,.06)" }, ticks: { font: { size: compact ? 8 : 9 }, callback: (value) => moneyCompact(value) } },
              },
            };
          }'''
          new_charts = '''  function renderCharts(trend) {
            const labels = trend.weeks.map((week) => shortDate(week.date));
            const idleMode = trend.metric === "idle";
            const actual = idleMode ? trend.weeks.map((week) => week.idle7DayPct) : trend.weeks.map((week) => week.totalCost);
            const context = idleMode ? trend.weeks.map((week) => week.idle28DayPct) : trend.rollingAverage;
            const rolling = trend.rollingAverage;

            if (state.heroChart) state.heroChart.destroy();
            state.heroChart = new Chart($("heroChart"), {
              type: "line",
              data: {
                labels,
                datasets: idleMode
                  ? [
                    { label: "7-Day Idle", data: actual, borderColor: "#b55cff", backgroundColor: "rgba(168,85,247,.2)", fill: true, tension: .28, pointRadius: 3, pointBackgroundColor: "#d9a2ff", borderWidth: 2, spanGaps: true },
                    { label: "28-Day Idle", data: context, borderColor: "#39ff63", backgroundColor: "transparent", borderDash: [7,5], tension: .25, pointRadius: 2, borderWidth: 2, spanGaps: true },
                  ]
                  : [
                    { label: "Actual Cost", data: actual, borderColor: "#b55cff", backgroundColor: "rgba(168,85,247,.2)", fill: true, tension: .28, pointRadius: 3, pointBackgroundColor: "#d9a2ff", borderWidth: 2 },
                    { label: "4-Week Avg", data: context, borderColor: "#39ff63", backgroundColor: "transparent", borderDash: [7,5], tension: .25, pointRadius: 0, borderWidth: 2 },
                  ],
              },
              options: chartOptions({ legend: true, compact: false, valueType: idleMode ? "percent" : "currency" }),
            });

            if (state.weeklyChart) state.weeklyChart.destroy();
            state.weeklyChart = new Chart($("weeklyChart"), {
              type: "line",
              data: {
                labels,
                datasets: idleMode
                  ? [
                    { label: "7-Day Idle", data: actual, borderColor: "#b55cff", backgroundColor: "rgba(168,85,247,.14)", fill: true, tension: .3, pointRadius: 3, borderWidth: 2, spanGaps: true },
                    { label: "4-Week Avg", data: rolling, borderColor: "#39ff63", borderDash: [6,4], tension: .25, pointRadius: 0, borderWidth: 2, spanGaps: true },
                  ]
                  : [
                    { label: "Total", data: actual, borderColor: "#b55cff", backgroundColor: "rgba(168,85,247,.14)", fill: true, tension: .3, pointRadius: 3, borderWidth: 2 },
                    { label: "Location", data: trend.weeks.map((week) => week.locationCost), borderColor: "#39ff63", borderDash: [6,4], tension: .25, pointRadius: 0, borderWidth: 2 },
                  ],
              },
              options: chartOptions({ legend: true, compact: true, valueType: idleMode ? "percent" : "currency" }),
            });
          }

          function chartOptions({ legend, compact, valueType = "currency" }) {
            const formatValue = (value) => valueType === "percent" ? pct(value, 1) : money(value, 2);
            return {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              plugins: {
                legend: { display: legend, position: "top", align: "start", labels: { boxWidth: 9, boxHeight: 9, font: { size: 9 }, padding: 12 } },
                tooltip: { backgroundColor: "rgba(4,9,13,.95)", borderColor: "rgba(168,85,247,.5)", borderWidth: 1, callbacks: { label: (context) => `${context.dataset.label}: ${formatValue(context.parsed.y)}` } },
              },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: compact ? 8 : 9 }, maxRotation: 0 } },
                y: {
                  beginAtZero: valueType === "percent",
                  grid: { color: "rgba(255,255,255,.06)" },
                  ticks: { font: { size: compact ? 8 : 9 }, callback: (value) => valueType === "percent" ? pct(value, 0) : moneyCompact(value) },
                },
              },
            };
          }'''
          app = replace_once(app, old_charts, new_charts, "chart renderer")

          index = replace_once(index, '<div class="chart-heading">EXTRA COST TREND</div>', '<div id="heroChartHeading" class="chart-heading">EXTRA COST TREND</div>', "hero chart heading")
          index = replace_once(index, '<div class="chart-callout"><span>POSSIBLE 28-DAY SAVINGS</span><strong id="heroSavings">--</strong></div>', '<div class="chart-callout"><span id="heroCalloutLabel">POSSIBLE 28-DAY SAVINGS</span><strong id="heroSavings">--</strong></div>', "hero chart callout")
          index = replace_once(index, '<div class="trend-total"><small>WEEK TOTAL</small><strong id="trendWeekTotal">--</strong><span id="trendWeekDelta">--</span></div>', '<div class="trend-total"><small id="trendTotalLabel">WEEK TOTAL</small><strong id="trendWeekTotal">--</strong><span id="trendWeekDelta">--</span></div>', "weekly trend label")

          app_path.write_text(app, encoding="utf-8")
          index_path.write_text(index, encoding="utf-8")
          Path("VERSION").write_text("3.11.0\n", encoding="utf-8")

      - name: Validate idle history
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const localStorage = { getItem: () => null, setItem: () => {} };
          const document = { addEventListener: () => {}, getElementById: () => null, querySelector: () => null, querySelectorAll: () => [] };
          const window = {
            localStorage,
            VixenReportExclusions: { matches: (record) => String(record?.driverCode || '') === '999999' },
            addEventListener: () => {}, setTimeout: () => {}, setInterval: () => {}, clearTimeout: () => {}, clearInterval: () => {}, scrollTo: () => {},
          };
          const sandbox = { console, window, document, localStorage, location: { protocol: 'http:' }, File: function(){}, fetch: async () => ({ ok: false }) };
          vm.runInNewContext(fs.readFileSync('app.js', 'utf8'), sandbox);
          const api = window.VixenIdleHistory;
          if (!api?.buildFleetIdleTrend) throw new Error('Idle history API missing.');
          const dates = ['2026-06-21','2026-06-28','2026-07-05','2026-07-12','2026-07-19'].map((value) => new Date(`${value}T00:00:00`));
          const history = (values) => values.map((idlePct, index) => ({ date: dates[index], idlePct }));
          const result = api.buildFleetIdleTrend(
            [
              { driverName: '111111 Eligible Driver', history: history([.30,.31,.32,.33,.34]) },
              { driverName: '999999 Excluded Driver', history: history([.90,.90,.90,.90,.90]) },
            ],
            [
              { driverName: '111111 Eligible Driver', history: history([.40,.41,.42,.43,.44]) },
              { driverName: '999999 Excluded Driver', history: history([.80,.80,.80,.80,.80]) },
            ],
            4,
          );
          if (result.length !== 4) throw new Error(`Expected latest four weeks, received ${result.length}.`);
          if (Math.abs(result[0].idle7DayPct - .31) > 1e-9 || Math.abs(result[3].idle28DayPct - .44) > 1e-9) throw new Error('Historical averages are incorrect or exclusions were ignored.');
          if (!fs.readFileSync('index.html','utf8').includes('id="heroChartHeading"')) throw new Error('Dynamic chart heading missing.');
          NODE

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html VERSION
          git commit -m "Show four-week idle history"
          git push origin main
