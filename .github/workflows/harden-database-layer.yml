name: Harden database layer

on:
  push:
    branches:
      - main
    paths:
      - .github/database-hardening-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-database-hardening
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch date parsing and status observer
        shell: python
        run: |
          from pathlib import Path

          db_path = Path("database/dashboard-db.js")
          db_text = db_path.read_text(encoding="utf-8")
          old_header = '''  function findHeader(headers, aliases, fallback) {
            const normalizedHeaders = headers.map(normalize);
            const found = normalizedHeaders.findIndex((header) => aliases.some((alias) => header === normalize(alias) || header.includes(normalize(alias))));
            return found >= 0 ? found : fallback;
          }
          '''
          new_header = '''  function findHeader(headers, aliases, fallback) {
            const normalizedHeaders = headers.map(normalize);
            const normalizedAliases = aliases.map(normalize);
            const exact = normalizedHeaders.findIndex((header) => normalizedAliases.includes(header));
            if (exact >= 0) return exact;
            const partial = normalizedHeaders.findIndex((header) => {
              const words = header.split(" ").filter(Boolean);
              return normalizedAliases.some((alias) => alias.includes(" ") ? header.includes(alias) : words.includes(alias));
            });
            return partial >= 0 ? partial : fallback;
          }
          '''
          old_date = '''  function parseDate(value) {
            if (!value) return null;
            const direct = new Date(value);
            if (!Number.isNaN(direct.getTime())) return direct;
            const excel = Number(value);
            if (Number.isFinite(excel) && excel > 20000 && excel < 100000) {
              const date = new Date(Math.round((excel - 25569) * 86400000));
              return Number.isNaN(date.getTime()) ? null : date;
            }
            return null;
          }
          '''
          new_date = '''  function parseDate(value) {
            if (!value) return null;
            const numericText = String(value).trim();
            const excel = Number(numericText);
            if (/^-?\\d+(?:\\.\\d+)?$/.test(numericText) && Number.isFinite(excel) && excel > 20000 && excel < 100000) {
              const date = new Date(Math.round((excel - 25569) * 86400000));
              return Number.isNaN(date.getTime()) ? null : date;
            }
            const direct = new Date(value);
            return Number.isNaN(direct.getTime()) ? null : direct;
          }
          '''
          if old_header not in db_text:
            raise SystemExit("Could not find findHeader implementation")
          if old_date not in db_text:
            raise SystemExit("Could not find parseDate implementation")
          db_path.write_text(db_text.replace(old_header, new_header, 1).replace(old_date, new_date, 1), encoding="utf-8")

          ui_path = Path("database/pta-history-ui.js")
          ui_text = ui_path.read_text(encoding="utf-8")
          old_status = '''  function updateDatabaseStatusCopy() {
            const message = document.getElementById("ptaPasteMessage");
            const noteStatus = document.getElementById("ptaActionNoteStatus");
            const driverStatus = document.getElementById("driverActionNoteStatus");
            if (message) message.textContent = "The current paste and every saved snapshot are stored in the dashboard database.";
            if (noteStatus) noteStatus.textContent = noteStatus.textContent.replace(/Saved only in this browser\\.|Notes stay in this browser\\./g, "Saved in the dashboard database.");
            if (driverStatus) driverStatus.textContent = driverStatus.textContent.replace(/browser/gi, "dashboard database");
          }
          '''
          new_status = '''  function updateDatabaseStatusCopy() {
            const message = document.getElementById("ptaPasteMessage");
            const noteStatus = document.getElementById("ptaActionNoteStatus");
            const driverStatus = document.getElementById("driverActionNoteStatus");
            setTextIfChanged(message, "The current paste and every saved snapshot are stored in the dashboard database.");
            if (noteStatus) {
              setTextIfChanged(noteStatus, noteStatus.textContent.replace(/Saved only in this browser\\.|Notes stay in this browser\\./g, "Saved in the dashboard database."));
            }
            if (driverStatus) {
              setTextIfChanged(driverStatus, driverStatus.textContent.replace(/browser/gi, "dashboard database"));
            }
          }

          function setTextIfChanged(element, value) {
            if (element && element.textContent !== value) element.textContent = value;
          }
          '''
          if old_status not in ui_text:
            raise SystemExit("Could not find status copy implementation")
          ui_path.write_text(ui_text.replace(old_status, new_status, 1), encoding="utf-8")

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check database/dashboard-db.js
          node --check database/pta-history-ui.js
          node --check database/bootstrap.js
          node --check database/pta-change-worker.js
          grep -F 'const numericText = String(value).trim();' database/dashboard-db.js
          grep -F 'function setTextIfChanged(element, value)' database/pta-history-ui.js

      - name: Commit hardening fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/dashboard-db.js database/pta-history-ui.js
          git commit -m "Harden PTA database parsing and UI updates"
          git push origin main
