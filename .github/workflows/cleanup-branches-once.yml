name: One-shot branch cleanup

on:
  issues:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == 'Run branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          mapfile -t branches < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          done

      - name: Remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path='.github/workflows/cleanup-branches-once.yml'
          sha="$(gh api "repos/$repo/contents/$path?ref=main" --jq '.sha')"
          gh api -X DELETE "repos/$repo/contents/$path" \
            -f message='Remove completed one-shot branch cleanup workflow' \
            -f sha="$sha" \
            -f branch='main'
