name: Publish v3 Fuel Dash release on merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - .github/release-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-v3-release
  cancel-in-progress: false

jobs:
  package-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Validate release request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="$(tr -d '\r\n ' < .github/release-request.txt)"
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION#v}"
          if [[ ! "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use v3.x.x. Found: $TAG" >&2
            exit 1
          fi
          if [[ "$REQUESTED" != "$TAG" ]]; then
            echo "Release request $REQUESTED does not match VERSION $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=Fuel_Dash-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Validate release entry points
        shell: python
        run: |
          from pathlib import Path
          import base64
          import subprocess

          entries = [
              Path("app.js"),
              Path("transition_export_v2.js"),
              Path("database/bootstrap.js"),
              Path("database/trip-planning-notes.js"),
          ]
          for entry in entries:
              if not entry.is_file():
                  raise SystemExit(f"Missing release entry point: {entry}")
              subprocess.run(["node", "--check", str(entry)], check=True)

          bootstrap = Path("database/bootstrap.js").read_text(encoding="utf-8")
          if '"database/trip-planning-notes.js"' not in bootstrap:
              raise SystemExit("Trip-planning notes module is not registered in database/bootstrap.js")

          folder = Path("database/rich-transition-patch")
          parts = [folder / f"part-{index:02d}.b64" for index in range(5)]
          missing = [str(path) for path in parts if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing rich transition bundle parts: {missing}")

          encoded = "".join("".join(path.read_text(encoding="utf-8").split()) for path in parts)
          source = base64.b64decode(encoded, validate=True)
          if not source.strip():
              raise SystemExit("Rich transition bundle decoded to an empty script")
          decoded = Path("/tmp/rich-transition-editor.js")
          decoded.write_bytes(source)
          subprocess.run(["node", "--check", str(decoded)], check=True)
          print(f"Validated rich transition editor: {len(source)} bytes")

      - name: Build release package
        shell: python
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place the current XLSX and PDF operating reports in this folder.\n"
              "Operational data, notes, exclusions, recipients, templates, and drafts remain in the local browser.\n",
              encoding="utf-8",
          )

          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_SHA"]
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: {tag}\nCommit: {commit}\n"
              "Data storage: local browser IndexedDB/local storage only.\n",
              encoding="utf-8",
          )

          zip_path = dist / os.environ["RELEASE_ASSET"]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / f"{zip_path.name}.sha256").write_text(
              f"{digest}  {zip_path.name}\n", encoding="ascii"
          )

          (dist / "release-notes.md").write_text(
              f"# Fuel Dash {tag}\n\n"
              "Adds a dedicated 305 Trip Notes workspace for truck-level trip planning. "
              "Dispatch can track driver, load or order, destination, PTA, status, next action, and chronological planning notes; "
              "sync Division 305 trucks from the manual PTA paste without overwriting existing notes; search and filter the queue; "
              "copy a shift handoff; and export the board to CSV.\n\n"
              "Trip-planning records remain in local browser storage. Operational data and browser settings are not bundled or uploaded.\n",
              encoding="utf-8",
          )

      - name: Create or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$ASSET" \
              "dist/$ASSET.sha256" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "Fuel Dash $TAG" \
              --notes-file dist/release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "dist/$ASSET" \
              "dist/$ASSET.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Fuel Dash $TAG" \
              --notes-file dist/release-notes.md \
              --latest
          fi
