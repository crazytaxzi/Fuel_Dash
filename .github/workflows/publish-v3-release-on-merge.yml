name: Publish v3 Fuel Dash release on merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - .github/release-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-v3-release
  cancel-in-progress: false

jobs:
  package-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Validate release request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="$(tr -d '\r\n ' < .github/release-request.txt)"
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION#v}"
          if [[ ! "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use v3.x.x. Found: $TAG" >&2
            exit 1
          fi
          if [[ "$REQUESTED" != "$TAG" ]]; then
            echo "Release request $REQUESTED does not match VERSION $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=Fuel_Dash-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Validate release entry points
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          javascript_entries = [
              Path("app.js"),
              Path("smart_data_loader.js"),
              Path("auxiliary_mode.js"),
              Path("missing_bol.js"),
              Path("worked_workflow.js"),
              Path("transition_export_v2.js"),
              Path("core/resource_coordinator.js"),
              Path("core/read_once_mode.js"),
              Path("core/required_dom_guard.js"),
              Path("database/bootstrap.js"),
              Path("database/idle-history-ui.js"),
              Path("database/trip-planning-notes.js"),
              Path("database/trip-planning-table.js"),
              Path("database/rich-transition-editor.js"),
              Path("database/transition-305-extension.js"),
              Path("database/transition-grouping.js"),
          ]
          for entry in javascript_entries:
              if not entry.is_file():
                  raise SystemExit(f"Missing release entry point: {entry}")
              subprocess.run(["node", "--check", str(entry)], check=True)

          required_files = [Path("serve_dashboard.ps1"), Path("Launch Fuel Dashboard.cmd")]
          for entry in required_files:
              if not entry.is_file():
                  raise SystemExit(f"Missing release file: {entry}")

          bootstrap = Path("database/bootstrap.js").read_text(encoding="utf-8")
          required_modules = [
              '"core/resource_coordinator.js"',
              '"core/read_once_mode.js"',
              '"core/required_dom_guard.js"',
              '"database/trip-planning-notes.js"',
              '"database/trip-planning-table.js"',
              '"database/transition-grouping.js"',
          ]
          missing_modules = [module for module in required_modules if module not in bootstrap]
          if missing_modules:
              raise SystemExit(f"Release modules are not registered in database/bootstrap.js: {missing_modules}")

          transition_loader = Path("transition_export_v2.js").read_text(encoding="utf-8")
          if '"database/transition-305-extension.js"' not in transition_loader:
              raise SystemExit("Division 305 transition extension is not registered in transition_export_v2.js")

          transition_extension = Path("database/transition-305-extension.js").read_text(encoding="utf-8")
          required_transition_tokens = [
              "division_305_followups",
              "card_start",
              "card_end",
              "sep_red",
              "sep_blue",
          ]
          missing_tokens = [token for token in required_transition_tokens if token not in transition_extension]
          if missing_tokens:
              raise SystemExit(f"Compact transition tokens are missing: {missing_tokens}")

          print(f"Validated {len(javascript_entries)} JavaScript entry points and {len(required_files)} launcher files")

      - name: Build release package
        shell: python
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place the current XLSX and PDF operating reports in this folder.\n"
              "Operational data, notes, exclusions, recipients, templates, and drafts remain in the local browser.\n",
              encoding="utf-8",
          )

          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_SHA"]
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: {tag}\nCommit: {commit}\n"
              "Data storage: local browser IndexedDB/local storage only.\n",
              encoding="utf-8",
          )

          zip_path = dist / os.environ["RELEASE_ASSET"]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / f"{zip_path.name}.sha256").write_text(
              f"{digest}  {zip_path.name}\n", encoding="ascii"
          )

          (dist / "release-notes.md").write_text(
              f"# Fuel Dash {tag}\n\n"
              "Introduces one continuous Today workflow for live PTA attention, high-priority driver reviews, and saved follow-ups. Urgent work rises to the top with attention counts, search, and optional browser notifications.\n\n"
              "Finish + handoff now completes a follow-up, selects it for transition, and advances directly to the next task. Finish only handles private work. Show all, Reopen, and Restore keep completed or hidden items recoverable.\n\n"
              "Navigation is grouped into Performance, Dispatch, Handoff, and Tools while preserving every existing feature. Concurrent report loading, parallel file inspection, and debounced table search improve responsiveness without changing fuel calculations. Operational reports and browser-stored notes remain local and are not included in the package.\n",
              encoding="utf-8",
          )

      - name: Create or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$ASSET" \
              "dist/$ASSET.sha256" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "Fuel Dash $TAG" \
              --notes-file dist/release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "dist/$ASSET" \
              "dist/$ASSET.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Fuel Dash $TAG" \
              --notes-file dist/release-notes.md \
              --latest
          fi
