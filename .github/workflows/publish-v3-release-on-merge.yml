name: Publish v3 Fuel Dash release on merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - .github/release-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-v3-release
  cancel-in-progress: false

jobs:
  package-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Validate release request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="$(tr -d '\r\n ' < .github/release-request.txt)"
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION#v}"
          if [[ ! "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use v3.x.x. Found: $TAG" >&2
            exit 1
          fi
          if [[ "$REQUESTED" != "$TAG" ]]; then
            echo "Release request $REQUESTED does not match VERSION $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=Fuel_Dash-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Validate release entry points
        id: validate
        shell: python
        run: |
          from pathlib import Path
          import base64
          import hashlib
          import re
          import subprocess

          report = ["Rich transition release diagnostic", ""]
          failed = False

          def check_js(path):
              global failed
              result = subprocess.run(
                  ["node", "--check", str(path)],
                  text=True,
                  capture_output=True,
              )
              report.append(f"node --check {path}: {'PASS' if result.returncode == 0 else 'FAIL'}")
              output = (result.stdout + result.stderr).strip()
              if output:
                  report.append(output)
              if result.returncode != 0:
                  failed = True
              report.append("")
              return result

          for entry in [Path("app.js"), Path("transition_export_v2.js"), Path("database/bootstrap.js")]:
              check_js(entry)

          folder = Path("database/rich-transition-patch")
          parts = [folder / f"part-{index:02d}.b64" for index in range(5)]
          missing = [str(path) for path in parts if not path.is_file()]
          if missing:
              report.append(f"Missing bundle parts: {missing}")
              failed = True
          else:
              cleaned = []
              for path in parts:
                  value = "".join(path.read_text(encoding="utf-8").split())
                  report.append(f"{path.name}: chars={len(value)} tail={value[-12:]!r}")
                  cleaned.append(value)
              encoded = "".join(cleaned)
              report.append(f"Combined base64: chars={len(encoded)} modulo4={len(encoded) % 4}")
              try:
                  source = base64.b64decode(encoded, validate=True)
                  report.append(f"Decoded bytes: {len(source)}")
                  report.append(f"Decoded SHA-256: {hashlib.sha256(source).hexdigest()}")
                  decoded = Path("/tmp/rich-transition-editor.js")
                  decoded.write_bytes(source)
                  result = check_js(decoded)
                  if result.returncode != 0:
                      match = re.search(r"rich-transition-editor\.js:(\d+)", result.stderr)
                      if match:
                          line_number = int(match.group(1))
                          source_lines = source.decode("utf-8", errors="replace").splitlines()
                          start = max(1, line_number - 6)
                          end = min(len(source_lines), line_number + 6)
                          report.append(f"Source context around line {line_number}:")
                          for index in range(start, end + 1):
                              marker = ">" if index == line_number else " "
                              report.append(f"{marker} {index:04d}: {source_lines[index - 1]}")
                  if not source.strip():
                      report.append("Decoded script is empty.")
                      failed = True
              except Exception as error:
                  report.append(f"Base64 decode failed: {type(error).__name__}: {error}")
                  failed = True

          diagnostic = Path(".github/rich-transition-diagnostic.txt")
          diagnostic.write_text("\n".join(report).rstrip() + "\n", encoding="utf-8")
          print(diagnostic.read_text(encoding="utf-8"))
          if failed:
              raise SystemExit(1)

      - name: Commit validation diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/rich-transition-diagnostic.txt ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rich-transition-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record rich transition validation diagnostic"
          git push origin main

      - name: Build release package
        shell: python
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place the current XLSX and PDF operating reports in this folder.\n"
              "Operational data, notes, exclusions, recipients, templates, and drafts remain in the local browser.\n",
              encoding="utf-8",
          )

          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_SHA"]
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: {tag}\nCommit: {commit}\n"
              "Data storage: local browser IndexedDB/local storage only.\n",
              encoding="utf-8",
          )

          zip_path = dist / os.environ["RELEASE_ASSET"]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / f"{zip_path.name}.sha256").write_text(
              f"{digest}  {zip_path.name}\n", encoding="ascii"
          )

          (dist / "release-notes.md").write_text(
              f"# Fuel Dash {tag}\n\n"
              "Fixes the dashboard startup failure caused by the damaged rich-transition bundle. "
              "The reconstructed editor is validated before packaging.\n\n"
              "The rich Outlook transition editor includes readable HTML sections, bold, italic, "
              "underline, emoji controls, rich clipboard copy, and multipart HTML .eml export.\n\n"
              "Operational data and browser settings are not bundled or uploaded.\n",
              encoding="utf-8",
          )

      - name: Create or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$ASSET" \
              "dist/$ASSET.sha256" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "Fuel Dash $TAG" \
              --notes-file dist/release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "dist/$ASSET" \
              "dist/$ASSET.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Fuel Dash $TAG" \
              --notes-file dist/release-notes.md \
              --latest
          fi
