name: Apply editable report exclusions

on:
  push:
    branches: [main]
    paths:
      - .github/apply-exclusion-manager.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply feature patch
        shell: python
        run: |
          from pathlib import Path
          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8")
          old = '  function isIdleExcludedDriver(driver) {\n    const rawName = String(driver?.driverName ?? "");'
          new = '  function isIdleExcludedDriver(driver) {\n    const manager = window.VixenReportExclusions;\n    if (manager?.matches) return manager.matches(driver);\n    const rawName = String(driver?.driverName ?? "");'
          if app.count(old) != 1:
              raise SystemExit("Idle exclusion matcher was not found exactly once")
          app_path.write_text(app.replace(old, new, 1), encoding="utf-8")

          manager_path = Path("database/exclusion-manager.js")
          manager = manager_path.read_text(encoding="utf-8")
          changes = {
            '    const codes = collectIds(record, ["driverCode", "driverId", "employeeCode", "employeeId", "code"]);': '    const codes = collectIds(record, ["driverCode", "driverId", "employeeCode", "employeeId", "code"], true);',
            '  function collectIds(record, fields) {': '  function collectIds(record, fields, includeDriverName = false) {',
            '    const text = fields.map((field) => String(record?.[field] ?? "")).join(" ") + ` ${record.driverName || ""}`;': '    const text = fields.map((field) => String(record?.[field] ?? "")).join(" ") + (includeDriverName ? ` ${record.driverName || ""}` : "");',
            'Driver rows remain available for audit and non-idle review. Exclusions are saved only in this browser.': 'Driver rows remain available for audit and non-idle review. Truck matching applies when the source record includes a truck or unit assignment. Exclusions are saved only in this browser.',
          }
          for old_text, new_text in changes.items():
              if manager.count(old_text) != 1:
                  raise SystemExit(f"Manager patch target not found exactly once: {old_text[:70]}")
              manager = manager.replace(old_text, new_text, 1)
          manager_path.write_text(manager, encoding="utf-8")
          Path("VERSION").write_text("3.10.0\n", encoding="utf-8")
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check database/bootstrap.js
          node --check database/exclusion-manager.js
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js database/exclusion-manager.js VERSION
          git commit -m "Add editable report exclusions"
          git push origin main
