name: Add transition day selector and publish v3.14.0

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - .github/transition-day-scope-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-transition-day-scope
  cancel-in-progress: false

jobs:
  update-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add yesterday and today selector
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import subprocess

          path = Path("database/rich-transition-editor.js")
          source = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '  const DRAFT_KEY = "vixenTransitionEmailDraftV2";\n  const FORMAT_VERSION = 2;',
              '  const DRAFT_KEY = "vixenTransitionEmailDraftV2";\n  const DATE_SCOPE_KEY = "vixenTransitionDateScopeV1";\n  const FORMAT_VERSION = 2;',
              "date scope key",
          )
          replace_once(
              '    "date", "time", "prepared", "weekday", "brand",',
              '    "date", "date_scope", "time", "prepared", "weekday", "brand",',
              "date scope placeholder",
          )
          replace_once(
              '  let settings = loadSettings();\n  let installed = false;',
              '  let settings = loadSettings();\n  let selectedDayOffsets = loadDateScope();\n  let installed = false;',
              "date scope state",
          )
          replace_once(
              '    setStatus("Transition refreshed from today’s selected notes.");',
              '    setStatus(`Transition refreshed from ${resolveDateScope(new Date(), selectedDayOffsets).sourceLabel}.`);',
              "open editor status",
          )
          replace_once(
              '''          <label class="transition-subject-field"><span>Subject template</span><input id="transitionSubjectTemplate" type="text" /></label>
        </div>
      </div>
      <div class="transition-editor-grid">''',
              '''          <label class="transition-subject-field"><span>Subject template</span><input id="transitionSubjectTemplate" type="text" /></label>
        </div>
      </div>
      <div class="transition-date-panel panel">
        <div class="transition-date-copy">
          <span class="transition-date-title">Transition dates</span>
          <span id="transitionDateScopeSummary" class="transition-date-help">Today</span>
        </div>
        <div class="transition-date-options" role="group" aria-label="Transition dates">
          <label class="transition-date-option">
            <input type="checkbox" data-transition-day-offset="-1" />
            <span><strong>Yesterday</strong><small id="transitionYesterdayDate"></small></span>
          </label>
          <label class="transition-date-option">
            <input type="checkbox" data-transition-day-offset="0" />
            <span><strong>Today</strong><small id="transitionTodayDate"></small></span>
          </label>
        </div>
      </div>
      <div class="transition-editor-grid">''',
              "date selector markup",
          )
          replace_once(
              '''      prepareEmail(true);
      setStatus("Prepared email refreshed from today’s selected notes.");''',
              '''      prepareEmail(true);
      setStatus(`Prepared email refreshed from ${resolveDateScope(new Date(), selectedDayOffsets).sourceLabel}.`);''',
              "refresh status",
          )
          replace_once(
              '    byId("copyTransitionPlainBtn")?.addEventListener("click", copyPlainEmail);\n\n    byId("transitionPlaceholderButtons")',
              '''    byId("copyTransitionPlainBtn")?.addEventListener("click", copyPlainEmail);
    document.querySelectorAll("[data-transition-day-offset]").forEach((input) => {
      input.addEventListener("change", handleDateScopeChange);
    });

    byId("transitionPlaceholderButtons")''',
              "date selector events",
          )
          replace_once(
              '    setEditorHtml("transitionTemplateEditor", settings.bodyTemplate);\n  }',
              '    setEditorHtml("transitionTemplateEditor", settings.bodyTemplate);\n    renderDateScopeControls();\n  }',
              "date selector population",
          )
          replace_once(
              '    const email = buildEmail(now, settings);',
              '    const email = buildEmail(now, settings, selectedDayOffsets);',
              "prepare selected days",
          )
          replace_once(
              '      `Subject: ${mimeHeader(email.subject || `Shift Transition - ${dateKey(now)}`)}`,',
              '      `Subject: ${mimeHeader(email.subject || `Shift Transition - ${email.context?.date || dateKey(now)}`)}`,',
              "eml subject scope",
          )
          replace_once(
              '    downloadBlob(headers, `Shift_Transition_${dateKey(now)}.eml`, "message/rfc822;charset=utf-8");',
              '    downloadBlob(headers, `Shift_Transition_${email.context?.file_key || dateKey(now)}.eml`, "message/rfc822;charset=utf-8");',
              "eml filename scope",
          )
          replace_once(
              '''  function buildEmail(now = new Date(), options = settings) {
    const context = buildContext(now);''',
              '''  function buildEmail(now = new Date(), options = settings, dayOffsets = selectedDayOffsets) {
    const context = buildContext(
      now,
      readObject(PTA_NOTES_KEY),
      readObject(DRIVER_NOTES_KEY),
      readObject(NOTE_SELECTION_KEY),
      dayOffsets,
    );''',
              "build email scope",
          )
          replace_once(
              '''    driverNotes = readObject(DRIVER_NOTES_KEY),
    selections = readObject(NOTE_SELECTION_KEY),
  ) {
    const context = buildContext(now, ptaNotes, driverNotes, selections);''',
              '''    driverNotes = readObject(DRIVER_NOTES_KEY),
    selections = readObject(NOTE_SELECTION_KEY),
    dayOffsets = selectedDayOffsets,
  ) {
    const context = buildContext(now, ptaNotes, driverNotes, selections, dayOffsets);''',
              "plain transition scope",
          )

          context_pattern = re.compile(r'''  function buildContext\(.*?\n  \}\n\n  function collectTruckFollowups''', re.S)
          context_replacement = '''  function buildContext(
    now = new Date(),
    ptaNotes = readObject(PTA_NOTES_KEY),
    driverNotes = readObject(DRIVER_NOTES_KEY),
    selections = readObject(NOTE_SELECTION_KEY),
    dayOffsets = selectedDayOffsets,
  ) {
    const scope = resolveDateScope(now, dayOffsets);
    const trucks = collectTruckFollowups(ptaNotes, scope, selections);
    const drivers = collectDriverFollowups(driverNotes, scope, selections);
    const truckHtml = trucks.length ? trucks.map((item) => item.html).join("") : emptyStateHtml(`No truck follow-ups selected for ${scope.emptyLabel}.`);
    const driverHtml = drivers.length ? drivers.map((item) => item.html).join("") : emptyStateHtml(`No driver follow-ups selected for ${scope.emptyLabel}.`);
    const all = [...trucks, ...drivers].sort((a, b) => a.savedAt - b.savedAt || a.text.localeCompare(b.text));
    return {
      date: scope.dateLabel,
      date_scope: scope.label,
      time: now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
      prepared: now.toLocaleString([], { month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }),
      weekday: scope.weekdayLabel,
      brand: escapeHtml((localStorage.getItem("vixenBrand") || "VIXEN").trim().toUpperCase()),
      truck_followups_html: truckHtml,
      driver_followups_html: driverHtml,
      all_followups_html: all.length ? all.map((item) => item.html).join("") : emptyStateHtml(`No follow-ups selected for ${scope.emptyLabel}.`),
      truck_followups: trucks.length ? trucks.map((item) => item.text).join("\\n\\n") : `None selected for ${scope.emptyLabel}.`,
      driver_followups: drivers.length ? drivers.map((item) => item.text).join("\\n\\n") : `None selected for ${scope.emptyLabel}.`,
      all_followups: all.length ? all.map((item) => item.text).join("\\n\\n") : `None selected for ${scope.emptyLabel}.`,
      truck_count: String(trucks.length),
      driver_count: String(drivers.length),
      followup_count: String(all.length),
      file_key: scope.fileKey,
      scope,
      trucks,
      drivers,
    };
  }

  function collectTruckFollowups'''
          source, count = context_pattern.subn(context_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"build context replacement: expected one match, found {count}")

          replace_once(
              '  function collectTruckFollowups(groups, now, selections) {',
              '  function collectTruckFollowups(groups, scope, selections) {',
              "truck collector scope",
          )
          replace_once(
              '.filter((note) => sameLocalDay(note.savedAt, now) && noteIncluded("pta", note, selections))',
              '.filter((note) => dateMatchesScope(note.savedAt, scope.dates) && noteIncluded("pta", note, selections))',
              "truck date filter",
          )
          replace_once(
              '        const details = [\n          note.driver ?',
              '        const details = [\n          scope.dates.length > 1 ? `<strong>Note date:</strong> ${escapeHtml(formatNoteDay(note.savedAt))}` : "",\n          note.driver ?',
              "truck note date html",
          )
          replace_once(
              '        const textDetails = [\n          note.driver ?',
              '        const textDetails = [\n          scope.dates.length > 1 ? `Note date ${formatNoteDay(note.savedAt)}` : "",\n          note.driver ?',
              "truck note date text",
          )
          replace_once(
              '    return items.sort((a, b) => a.text.localeCompare(b.text));\n  }\n\n  function collectDriverFollowups(groups, now, selections) {',
              '    return items.sort((a, b) => a.savedAt - b.savedAt || a.text.localeCompare(b.text));\n  }\n\n  function collectDriverFollowups(groups, scope, selections) {',
              "truck sort and driver collector scope",
          )
          replace_once(
              '.filter((note) => sameLocalDay(note.savedAt, now) && noteIncluded("driver", note, selections))',
              '.filter((note) => dateMatchesScope(note.savedAt, scope.dates) && noteIncluded("driver", note, selections))',
              "driver date filter",
          )
          replace_once(
              '        const metricPairs = [\n          ["Idle today",',
              '        const metricPairs = [\n          ...(scope.dates.length > 1 ? [["Note date", formatNoteDay(note.savedAt)]] : []),\n          ["Idle today",',
              "driver note date",
          )
          replace_once(
              '    return items.sort((a, b) => a.text.localeCompare(b.text));\n  }\n\n  function followupCardHtml',
              '    return items.sort((a, b) => a.savedAt - b.savedAt || a.text.localeCompare(b.text));\n  }\n\n  function followupCardHtml',
              "driver chronological sort",
          )

          helpers = '''  function normalizeDayOffsets(value) {
    const source = Array.isArray(value) ? value : [];
    const offsets = [...new Set(source.map(Number).filter((offset) => offset === -1 || offset === 0))]
      .sort((a, b) => a - b);
    return offsets.length ? offsets : [0];
  }

  function loadDateScope() {
    try {
      return normalizeDayOffsets(JSON.parse(localStorage.getItem(DATE_SCOPE_KEY) || "[0]"));
    } catch (_) {
      return [0];
    }
  }

  function dateAtOffset(now, offset) {
    const date = new Date(now);
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() + offset);
    return date;
  }

  function resolveDateScope(now = new Date(), offsets = selectedDayOffsets) {
    const normalized = normalizeDayOffsets(offsets);
    const dates = normalized.map((offset) => dateAtOffset(now, offset));
    const both = dates.length > 1;
    const yesterdayOnly = !both && normalized[0] === -1;
    const label = both ? "Yesterday and Today" : yesterdayOnly ? "Yesterday" : "Today";
    const emptyLabel = both ? "yesterday and today" : yesterdayOnly ? "yesterday" : "today";
    const sourceLabel = both ? "yesterday and today’s selected notes" : yesterdayOnly ? "yesterday’s selected notes" : "today’s selected notes";
    const dateLabel = both
      ? `${dates[0].toLocaleDateString([], { month: "long", day: "numeric" })} and ${dates[1].toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" })}`
      : dates[0].toLocaleDateString([], { month: "long", day: "numeric", year: "numeric" });
    const weekdayLabel = dates.map((date) => date.toLocaleDateString([], { weekday: "long" })).join(" and ");
    return {
      offsets: normalized,
      dates,
      label,
      emptyLabel,
      sourceLabel,
      dateLabel,
      weekdayLabel,
      fileKey: dates.map(dateKey).join("_"),
    };
  }

  function dateMatchesScope(value, dates) {
    return (Array.isArray(dates) ? dates : []).some((date) => sameLocalDay(value, date));
  }

  function formatNoteDay(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "Unknown date" : date.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }

  function renderDateScopeControls() {
    const now = new Date();
    document.querySelectorAll("[data-transition-day-offset]").forEach((input) => {
      input.checked = selectedDayOffsets.includes(Number(input.dataset.transitionDayOffset));
    });
    const yesterday = byId("transitionYesterdayDate");
    const today = byId("transitionTodayDate");
    const summary = byId("transitionDateScopeSummary");
    if (yesterday) yesterday.textContent = dateAtOffset(now, -1).toLocaleDateString([], { month: "short", day: "numeric" });
    if (today) today.textContent = dateAtOffset(now, 0).toLocaleDateString([], { month: "short", day: "numeric" });
    if (summary) summary.textContent = resolveDateScope(now, selectedDayOffsets).label;
  }

  function handleDateScopeChange(event) {
    const checked = [...document.querySelectorAll("[data-transition-day-offset]:checked")]
      .map((input) => Number(input.dataset.transitionDayOffset));
    if (!checked.length) {
      event.currentTarget.checked = true;
      setStatus("Choose at least one transition date.", true);
      return;
    }
    selectedDayOffsets = normalizeDayOffsets(checked);
    localStorage.setItem(DATE_SCOPE_KEY, JSON.stringify(selectedDayOffsets));
    renderDateScopeControls();
    prepareEmail(true);
    setStatus(`Prepared email now uses ${resolveDateScope(new Date(), selectedDayOffsets).sourceLabel}.`);
  }

'''
          replace_once(
              '  function updateSummary(context) {',
              helpers + '  function updateSummary(context) {',
              "date scope helpers",
          )
          replace_once(
              '    if (meta) meta.textContent = `${context.truck_count} truck note${context.truck_count === "1" ? "" : "s"} · ${context.driver_count} driver note${context.driver_count === "1" ? "" : "s"} · prepared ${context.prepared}`;',
              '    if (meta) meta.textContent = `${context.date_scope} · ${context.truck_count} truck note${context.truck_count === "1" ? "" : "s"} · ${context.driver_count} driver note${context.driver_count === "1" ? "" : "s"} · prepared ${context.prepared}`;',
              "summary scope",
          )
          replace_once(
              '    if ([PTA_NOTES_KEY, DRIVER_NOTES_KEY, NOTE_SELECTION_KEY].includes(event.key)) prepareEmail(true);\n  }',
              '''    if (event.key === DATE_SCOPE_KEY) {
      selectedDayOffsets = loadDateScope();
      renderDateScopeControls();
      prepareEmail(true);
    }
    if ([PTA_NOTES_KEY, DRIVER_NOTES_KEY, NOTE_SELECTION_KEY].includes(event.key)) prepareEmail(true);
  }''',
              "scope storage sync",
          )
          replace_once(
              '      .transition-address-panel{margin-bottom:18px;padding:16px}',
              '      .transition-address-panel{margin-bottom:12px;padding:16px}.transition-date-panel{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:13px 16px}.transition-date-copy{display:grid;gap:3px}.transition-date-title{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8}.transition-date-help{font-size:12px;color:#cbd5e1}.transition-date-options{display:flex;gap:9px;flex-wrap:wrap}.transition-date-option{display:flex;align-items:center;gap:8px;min-width:128px;padding:8px 11px;border:1px solid rgba(148,163,184,.28);border-radius:10px;background:rgba(15,23,42,.65);cursor:pointer}.transition-date-option:has(input:checked){border-color:rgba(74,222,128,.65);background:rgba(34,197,94,.1)}.transition-date-option input{width:auto;accent-color:#39ff63}.transition-date-option span{display:grid;gap:1px}.transition-date-option strong{font-size:12px;color:#e5edf4}.transition-date-option small{font-size:10px;color:#94a3b8}',
              "date scope styles",
          )
          replace_once(
              '@media(max-width:1180px){.transition-editor-grid{grid-template-columns:1fr}}@media(max-width:680px){',
              '@media(max-width:1180px){.transition-editor-grid{grid-template-columns:1fr}}@media(max-width:680px){.transition-date-panel{align-items:stretch;flex-direction:column}.transition-date-options{display:grid;grid-template-columns:1fr 1fr}.transition-date-option{min-width:0}',
              "mobile date scope styles",
          )

          path.write_text(source, encoding="utf-8")
          Path("VERSION").write_text("3.14.0\n", encoding="utf-8")
          Path(".github/release-request.txt").write_text("v3.14.0\n", encoding="utf-8")

          manifest_path = Path("database/rich-transition-editor.manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = "3.14.0"
          manifest["transitionDateScope"] = "yesterday, today, or both; today is the default"
          manifest["selectedDateStorage"] = DATE_SCOPE = "vixenTransitionDateScopeV1"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          for script in [path, Path("transition_export_v2.js"), Path("database/bootstrap.js"), Path("app.js")]:
              subprocess.run(["node", "--check", str(script)], check=True)

          required = [
              'data-transition-day-offset="-1"',
              'data-transition-day-offset="0"',
              'function resolveDateScope(',
              'function dateMatchesScope(',
              'DATE_SCOPE_KEY',
              'date_scope: scope.label',
              'file_key: scope.fileKey',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"Missing date-scope marker: {marker}")

          print(f"Updated transition editor to {len(source.encode('utf-8'))} bytes")

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION .github/release-request.txt database/rich-transition-editor.js database/rich-transition-editor.manifest.json
          git commit -m "Add yesterday and today transition selector"
          git push origin main

      - name: Build package
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import zipfile

          root = Path.cwd()
          subprocess.run(["git", "pull", "--ff-only", "origin", "main"], check=True)
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)
          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)
          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place current XLSX and PDF reports in this folder. Operational notes and settings remain in the local browser.\n",
              encoding="utf-8",
          )
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: v3.14.0\nCommit: {commit}\n",
              encoding="utf-8",
          )
          zip_path = dist / "Fuel_Dash-v3.14.0.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(package.rglob("*")):
                  if file.is_file():
                      archive.write(file, file.relative_to(dist))
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / "Fuel_Dash-v3.14.0.zip.sha256").write_text(
              f"{digest}  Fuel_Dash-v3.14.0.zip\n", encoding="ascii"
          )
          (dist / "release-notes.md").write_text(
              "# Fuel Dash v3.14.0\n\n"
              "Adds independent Yesterday and Today selectors to the Transition editor. Today remains the default; either day or both days may be included. "
              "Combined transitions display the note date on each follow-up card, and the selected range controls counts, subject dates, empty states, and .eml filenames.\n\n"
              "Recipients, templates, drafts, notes, and the selected transition scope remain in the local browser.\n",
              encoding="utf-8",
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"
          if gh release view v3.14.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.14.0 dist/Fuel_Dash-v3.14.0.zip dist/Fuel_Dash-v3.14.0.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v3.14.0 --title "Fuel Dash v3.14.0" --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v3.14.0 dist/Fuel_Dash-v3.14.0.zip dist/Fuel_Dash-v3.14.0.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Fuel Dash v3.14.0" --notes-file dist/release-notes.md --latest
          fi
