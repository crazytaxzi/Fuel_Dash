name: Remove transition font colors and publish v3.13.3

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - .github/transition-auto-font-color-request.txt

permissions:
  contents: write

jobs:
  update-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove outgoing font colors
        shell: python
        run: |
          from pathlib import Path
          import json
          import subprocess

          root = Path.cwd()
          editor_path = root / "database" / "rich-transition-editor.js"
          source = editor_path.read_text(encoding="utf-8")

          start = source.find("  function removeEmailBackgrounds(html) {")
          end = source.find("\n\n\n  function sanitizeHtmlBase(value) {", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate email cleanup functions")

          replacement = '''  function removeEmailBackgrounds(html) {
            const container = document.createElement("div");
            container.innerHTML = String(html ?? "");
            container.querySelectorAll("*").forEach((element) => {
              element.style.removeProperty("background");
              element.style.removeProperty("background-color");
              element.style.removeProperty("background-image");
              element.style.removeProperty("color");
              element.removeAttribute("bgcolor");
              element.removeAttribute("background");
              element.removeAttribute("color");
            });
            return stripEmailPresentationCss(container.innerHTML);
          }

          function stripEmailPresentationCss(value) {
            return String(value ?? "")
              .replace(/(?:background(?:-color|-image)?)\\s*:[^;"']*;?/gi, "")
              .replace(/(^|[;"'])\\s*color\\s*:[^;"']*;?/gi, "$1")
              .replace(/\\s(?:bgcolor|background|color)\\s*=\\s*(["']).*?\\1/gi, "");
          }
          '''
          source = source[:start] + replacement + source[end:]
          source = source.replace("stripEmailBackgroundCss(", "stripEmailPresentationCss(")

          required = [
              'element.style.removeProperty("color")',
              'element.removeAttribute("color")',
              "function stripEmailPresentationCss(value)",
          ]
          for token in required:
              if token not in source:
                  raise SystemExit(f"Missing auto-font-color behavior: {token}")
          if "const readableColors" in source or "stripEmailBackgroundCss(" in source:
              raise SystemExit("Forced font-color behavior remains")

          editor_path.write_text(source, encoding="utf-8")

          manifest_path = root / "database" / "rich-transition-editor.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = "3.13.3"
          manifest["emailFontColor"] = "automatic; outgoing inline font colors are removed at render time"
          manifest["savedTemplates"] = "existing browser-saved templates are cleaned during rendering"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          (root / "VERSION").write_text("3.13.3\n", encoding="utf-8")
          (root / ".github" / "release-request.txt").write_text("v3.13.3\n", encoding="utf-8")

          for script in [editor_path, root / "transition_export_v2.js", root / "database" / "bootstrap.js", root / "app.js"]:
              subprocess.run(["node", "--check", str(script)], check=True)

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION .github/release-request.txt database/rich-transition-editor.js database/rich-transition-editor.manifest.json
          git commit -m "Use automatic transition email font color"
          git push origin main

      - name: Build package
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import zipfile

          root = Path.cwd()
          subprocess.run(["git", "pull", "--ff-only", "origin", "main"], check=True)
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)
          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)
          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place current XLSX and PDF reports in this folder. Operational notes and settings remain in the local browser.\n",
              encoding="utf-8",
          )
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: v3.13.3\nCommit: {commit}\n",
              encoding="utf-8",
          )
          zip_path = dist / "Fuel_Dash-v3.13.3.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / "Fuel_Dash-v3.13.3.zip.sha256").write_text(
              f"{digest}  Fuel_Dash-v3.13.3.zip\n",
              encoding="ascii",
          )
          (dist / "release-notes.md").write_text(
              "# Fuel Dash v3.13.3\n\n"
              "Transition email font color is now automatic. Outgoing rich clipboard HTML and HTML .eml files contain no forced inline font colors, allowing Outlook and the recipient theme to choose readable text color. Existing saved templates are cleaned during rendering.\n",
              encoding="utf-8",
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v3.13.3 \
            dist/Fuel_Dash-v3.13.3.zip \
            dist/Fuel_Dash-v3.13.3.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Fuel Dash v3.13.3" \
            --notes-file dist/release-notes.md \
            --latest
