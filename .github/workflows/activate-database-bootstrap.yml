name: Activate database bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/database-bootstrap-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-database-bootstrap
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace direct app loader
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          old = '  <script src="app.js"></script>'
          new = '\n'.join([
              '  <script src="database/dashboard-db.js"></script>',
              '  <script src="database/bootstrap.js"></script>',
          ])
          if new in content:
              print("Database bootstrap is already active.")
          elif old in content:
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
          else:
              raise SystemExit("Could not find the direct app.js loader in index.html")

      - name: Validate loader files
        shell: bash
        run: |
          test -f database/dashboard-db.js
          test -f database/bootstrap.js
          test -f database/pta-history-ui.js
          test -f database/pta-change-worker.js
          node --check database/dashboard-db.js
          node --check database/bootstrap.js
          node --check database/pta-history-ui.js
          node --check database/pta-change-worker.js
          grep -F '<script src="database/dashboard-db.js"></script>' index.html
          grep -F '<script src="database/bootstrap.js"></script>' index.html
          ! grep -F '<script src="app.js"></script>' index.html

      - name: Commit activation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load dashboard through IndexedDB bootstrap"
          git push origin main
