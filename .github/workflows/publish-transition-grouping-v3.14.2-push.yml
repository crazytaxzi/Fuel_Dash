name: Publish grouped transition messages v3.14.2 push

on:
  push:
    branches: [main]
    paths:
      - .github/release-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-transition-grouping-v3-14-2-push
  cancel-in-progress: false

jobs:
  migrate-test-package-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < .github/release-request.txt)" = "v3.14.2"
          python -m py_compile .github/scripts/apply_transition_grouping.py
          node --check database/transition-grouping.js
          node --check .github/scripts/test_transition_grouping.js

      - name: Apply grouping migration
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_transition_grouping.py
          node --check database/transition-grouping.js
          node --check database/rich-transition-editor.js
          node --check database/bootstrap.js
          node --check transition_export_v2.js
          node --check app.js
          node .github/scripts/test_transition_grouping.js
          grep -F 'groupSelectedFollowups' database/rich-transition-editor.js
          grep -F 'group_count' database/rich-transition-editor.js
          grep -F 'database/transition-grouping.js' database/bootstrap.js
          test "$(tr -d '\r\n ' < VERSION)" = "3.14.2"

      - name: Commit grouped transition source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION database/bootstrap.js database/rich-transition-editor.js database/rich-transition-editor.manifest.json
          git commit -m "Group matching transition messages"
          git push origin main

      - name: Build package
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {".git", ".github", "data", "dist", "Dashboard_Server_Log.txt"}
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place the current XLSX and PDF operating reports in this folder.\n"
              "Operational data, notes, exclusions, and transition settings remain in the local browser.\n",
              encoding="utf-8",
          )

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: v3.14.2\nCommit: {commit}\n",
              encoding="utf-8",
          )

          zip_path = dist / "Fuel_Dash-v3.14.2.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / "Fuel_Dash-v3.14.2.zip.sha256").write_text(
              f"{digest}  Fuel_Dash-v3.14.2.zip\n",
              encoding="ascii",
          )
          (dist / "release-notes.md").write_text(
              "# Fuel Dash v3.14.2\n\n"
              "Transition notes are now grouped into one chronological card when any normalized driver code, driver name, or truck number matches. Cross-matched PTA and driver-idle notes share the same card. Raw selected-note counts remain visible, and the preview also reports the number of matched groups.\n",
              encoding="utf-8",
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"
          if gh release view v3.14.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.14.2 dist/Fuel_Dash-v3.14.2.zip dist/Fuel_Dash-v3.14.2.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v3.14.2 --title "Fuel Dash v3.14.2" --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v3.14.2 dist/Fuel_Dash-v3.14.2.zip dist/Fuel_Dash-v3.14.2.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Fuel Dash v3.14.2" --notes-file dist/release-notes.md --latest
          fi
