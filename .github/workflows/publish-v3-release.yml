name: Publish v3 Fuel Dash release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-v3-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="$(tr -d '\r\n ' < .github/release-request.txt)"
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION#v}"
          if [[ ! "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use the v3.x.x convention. Found: $TAG" >&2
            exit 1
          fi
          if [[ "$REQUESTED" != "$TAG" ]]; then
            echo "Release request $REQUESTED does not match VERSION $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=Fuel_Dash-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node validate_dashboard.js
          scripts=(
            app.js
            smart_data_loader.js
            auxiliary_mode.js
            missing_bol.js
            missing_bol_driver_only.js
            worked_workflow.js
            special_notes.js
            note_transition_toggle.js
            pdf_to_xlsx.js
            transition_export_v2.js
            database/dashboard-db.js
            database/bootstrap.js
            database/pta-history-ui.js
            database/pta-change-worker.js
            database/worked-navigation-fix.js
            database/exclusion-manager.js
            database/idle-history-ui.js
            database/rich-transition-editor.js
            database/transition-305-extension.js
            database/transition-grouping.js
          )
          for script in "${scripts[@]}"; do
            [[ -f "$script" ]] || { echo "Missing release entry point: $script" >&2; exit 1; }
            node --check "$script"
          done

          grep -F 'data-editor-command="bold"' database/rich-transition-editor.js
          grep -F 'ClipboardItem' database/rich-transition-editor.js
          grep -F 'multipart/alternative' database/rich-transition-editor.js

      - name: Build downloadable ZIP
        shell: python
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)

          excluded = {
              ".git", ".github", ".gitattributes", "data", "dist", "tests",
              "Dashboard_Server_Log.txt", "validate_dashboard.js", "summary.xlsx", "summary chart.xlsx",
              "APU Column Guide.txt", "PDF Driver Report Guide.txt", "PTA Action Notes Guide.txt",
              "PTA Column Guide.txt", "PTA Manual Paste Guide.txt",
          }
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              elif item.is_file():
                  shutil.copy2(item, target)

          for internal_file in [package / "database" / "README.md", package / "database" / "rich-transition-editor.manifest.json"]:
              internal_file.unlink(missing_ok=True)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Place the current XLSX and PDF operating reports in this folder.\n"
              "PTA snapshots, notes, history, report exclusions, and transition email settings remain in the local browser database and are not included in this package.\n",
              encoding="utf-8",
          )

          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_SHA"]
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: {tag}\nCommit: {commit}\n"
              "Data storage: local browser IndexedDB/local storage only; no operational records are bundled or shared.\n",
              encoding="utf-8",
          )

          zip_path = dist / os.environ["RELEASE_ASSET"]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          checksum = dist / f"{zip_path.name}.sha256"
          checksum.write_text(f"{digest}  {zip_path.name}\n", encoding="ascii")

          notes = dist / "release-notes.md"
          notes.write_text(
              f"# Fuel Dash {tag}\n\n"
              "This stable package contains the current dashboard from `main`.\n\n"
              "## Included\n\n"
              "- Private Special Notes workspace with optional date/time reminders, quick timers, completion, reopening, search, and recovery through Show all\n"
              "- Change-driven browser notifications that alert once for newly due reminders or changed Today attention items\n"
              "- Simplified bordered truck and Division 305 transition cards with bold truck numbers, driver names, and note text only\n"
              "- Bordered manual transition blocks generated by card_start and card_end placeholders\n"
              "- Desktop-only layout with a full stationary sidebar image and independently scrolling navigation\n"
              "- Single-confirmation Finish only and Finish + handoff actions\n"
              "- Local IndexedDB persistence for PTA snapshots, notes, settings, and follow-up state\n"
              "- Searchable PTA history and change alerts\n"
              "- Worked entries that open the correct truck or driver details and show only open follow-ups\n"
              "- Editable Exclusions tab for driver names, driver codes, and truck numbers\n"
              "- Exclusions applied to fleet idle averages, thresholds, rankings, historical charts, and idle-related APU coaching\n"
              "- Four-week 7-day and 28-day fleet idle history in Hero Insight and Weekly Trend\n"
              "- Rich Outlook transition editor with readable HTML sections, bold/italic/underline controls, emoji picker, rich clipboard copy, multipart .eml download, and plain-text fallback\n"
              "- Existing fuel, idle, APU, Missing BOL, and shift-transition tools\n\n"
              "## Privacy\n\n"
              "Operational PTA data, notes, saved exclusions, transition recipients, and email templates are not included in this release and are not uploaded to GitHub. They remain in the browser profile on the computer running the dashboard.\n\n"
              "## Install\n\n"
              "Download the ZIP, extract it, place current report files in the `data` folder, and run `Launch Fuel Dashboard.cmd`.\n",
              encoding="utf-8",
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "dist/$ASSET" \
            "dist/$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fuel Dash $TAG" \
            --notes-file dist/release-notes.md

      - name: Record release success
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n%s\n' "$TAG" "$ASSET" "$GITHUB_SHA" > .github/release-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-result.txt
          git commit -m "Record Fuel Dash release $TAG"
          git push origin main
