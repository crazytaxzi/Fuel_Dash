name: Publish v3 Fuel Dash release

on:
  push:
    branches: [main]
    paths: [.github/release-request.txt]

permissions:
  contents: write

concurrency:
  group: fuel-dash-v3-release
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="$(tr -d '\r\n ' < .github/release-request.txt)"
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION#v}"
          [[ "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must use v3.x.x. Found: $TAG" >&2; exit 1; }
          [[ "$REQUESTED" == "$TAG" ]] || { echo "Release request $REQUESTED does not match VERSION $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=Fuel_Dash-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Validate dashboard
        shell: bash
        run: |
          set -euo pipefail
          node validate_dashboard.js
          while IFS= read -r script; do
            node --check "$script"
          done < <(find . -type f -name '*.js' \
            -not -path './vendor/*' \
            -not -path './dist/*' \
            -not -path './data/*' \
            -not -path './node_modules/*' | sort)
          node tests/driver_report_adapter_smoke.js
          node tests/driver_centric_parser_smoke.js
          node tests/cleanup_architecture_smoke.js
          grep -F 'data-editor-command="bold"' database/rich-transition-editor.js
          grep -F 'ClipboardItem' database/rich-transition-editor.js
          grep -F 'multipart/alternative' database/rich-transition-editor.js

      - name: Build downloadable ZIP
        shell: python
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          from pathlib import Path
          import hashlib, os, shutil, zipfile

          root = Path.cwd()
          dist = root / "dist"
          package = dist / "Fuel_Dash"
          shutil.rmtree(dist, ignore_errors=True)
          package.mkdir(parents=True)
          excluded = {
              ".git", ".github", ".gitattributes", ".gitignore", "data", "dist", "tests",
              "Dashboard_Server_Log.txt", "validate_dashboard.js", "summary.xlsx", "summary chart.xlsx",
              "APU Column Guide.txt", "PDF Driver Report Guide.txt", "PTA Action Notes Guide.txt",
              "PTA Column Guide.txt", "PTA Manual Paste Guide.txt",
          }
          for item in root.iterdir():
              if item.name in excluded:
                  continue
              target = package / item.name
              shutil.copytree(item, target) if item.is_dir() else shutil.copy2(item, target)

          for internal in [package / "database" / "README.md", package / "database" / "rich-transition-editor.manifest.json"]:
              internal.unlink(missing_ok=True)

          data_dir = package / "data"
          data_dir.mkdir(exist_ok=True)
          (data_dir / "PLACE_REPORTS_HERE.txt").write_text(
              "Core driver reports: Rolling 7 Day.xlsx and Driver Details.xlsx.\n"
              "Optional enrichment: Detail, Missing BOL assignments, PTA, and APU reports.\n"
              "Operational notes and settings remain in the local browser database.\n",
              encoding="utf-8",
          )

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          index = package / "index.html"
          if index.exists():
              index.write_text(index.read_text(encoding="utf-8").replace("3.21.1", version), encoding="utf-8")
          commit = os.environ["RELEASE_SHA"]
          (package / "RELEASE_BUILD.txt").write_text(
              f"Fuel Dash\nVersion: {tag}\nCommit: {commit}\n"
              "Data storage: local browser IndexedDB/local storage only.\n",
              encoding="utf-8",
          )

          zip_path = dist / os.environ["RELEASE_ASSET"]
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(dist))
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (dist / f"{zip_path.name}.sha256").write_text(f"{digest}  {zip_path.name}\n", encoding="ascii")
          (dist / "release-notes.md").write_text(
              f"# Fuel Dash {tag}\n\n"
              "Driver-centric operations workbench with PTA-prioritized driver/truck cards.\n\n"
              "## Core reports\n\n"
              "- Rolling 7 Day.xlsx\n"
              "- Driver Details.xlsx\n\n"
              "Detail, Missing BOL, PTA, and APU reports are optional enrichments.\n\n"
              "Operational data remains local to the browser profile and is not included in the release.\n",
              encoding="utf-8",
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "Release $TAG already exists." >&2; exit 1; }
          gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Fuel Dash $TAG" --notes-file dist/release-notes.md

      - name: Record release success
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n%s\n' "$TAG" "$ASSET" "$GITHUB_SHA" > .github/release-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-result.txt
          git commit -m "Record Fuel Dash release $TAG"
          git push origin main
