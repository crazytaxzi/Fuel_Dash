name: Repair and publish Fuel Dash v3.13.1

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths: [.github/repair-rich-transition.txt]

permissions:
  contents: write

jobs:
  repair-and-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Repair and validate editor
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, subprocess

          request = Path('.github/repair-rich-transition.txt').read_text().strip()
          if request != 'v3.13.1':
              raise SystemExit(f'Unexpected repair request: {request}')

          folder = Path('database/rich-transition-patch')
          parts = [folder / f'part-{i:02d}.b64' for i in range(5)]
          encoded = ''.join(''.join(p.read_text().split()) for p in parts)
          source = base64.b64decode(encoded, validate=True)
          broken = b'cc: valueOf("transitionCcInput",\n'
          fixed = b'cc: valueOf("transitionCcInput"),\n'
          if source.count(broken) == 1:
              source = source.replace(broken, fixed, 1)
          elif source.count(fixed) != 1:
              raise SystemExit('Rich editor source is not in the expected repair state')

          temp = Path('/tmp/rich-transition-editor.js')
          temp.write_bytes(source)
          subprocess.run(['node', '--check', str(temp)], check=True)

          encoded = base64.b64encode(source).decode('ascii')
          chunks = [encoded[i:i + 12000] for i in range(0, len(encoded), 12000)]
          if len(chunks) != 5:
              raise SystemExit(f'Expected 5 chunks, found {len(chunks)}')
          for path, chunk in zip(parts, chunks):
              path.write_text(chunk, encoding='ascii')

          manifest_path = folder / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '3.13.1'
          manifest['sha256'] = hashlib.sha256(source).hexdigest()
          manifest['sourceBytes'] = len(source)
          manifest['validation'] = 'Strict base64 decoding and JavaScript syntax validation passed before release.'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(f"Validated {len(source)} bytes, SHA-256 {manifest['sha256']}")

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/rich-transition-patch/part-*.b64 database/rich-transition-patch/manifest.json
          git rm -f .github/rich-transition-diagnostic.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'Repair rich transition editor source'
            git push origin main
          fi
          git rev-parse HEAD > /tmp/release-sha

      - name: Build package
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil, zipfile
          root = Path.cwd(); dist = root / 'dist'; package = dist / 'Fuel_Dash'
          shutil.rmtree(dist, ignore_errors=True); package.mkdir(parents=True)
          excluded = {'.git', '.github', 'data', 'dist', 'Dashboard_Server_Log.txt'}
          for item in root.iterdir():
              if item.name in excluded: continue
              target = package / item.name
              shutil.copytree(item, target) if item.is_dir() else shutil.copy2(item, target)
          (package / 'data').mkdir(exist_ok=True)
          (package / 'data' / 'PLACE_REPORTS_HERE.txt').write_text('Place current XLSX and PDF reports in this folder.\n')
          sha = Path('/tmp/release-sha').read_text().strip()
          (package / 'RELEASE_BUILD.txt').write_text(f'Fuel Dash\nVersion: v3.13.1\nCommit: {sha}\n')
          archive = dist / 'Fuel_Dash-v3.13.1.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in sorted(package.rglob('*')):
                  if path.is_file(): z.write(path, path.relative_to(dist))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / 'Fuel_Dash-v3.13.1.zip.sha256').write_text(f'{digest}  Fuel_Dash-v3.13.1.zip\n')
          (dist / 'release-notes.md').write_text('# Fuel Dash v3.13.1\n\nFixes the rich transition editor startup failure caused by a missing closing parenthesis in the Cc template field. The reconstructed editor passed strict decoding and JavaScript syntax validation before packaging.\n')

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(cat /tmp/release-sha)"
          if gh release view v3.13.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v3.13.1 dist/Fuel_Dash-v3.13.1.zip dist/Fuel_Dash-v3.13.1.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v3.13.1 --title 'Fuel Dash v3.13.1' --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v3.13.1 dist/Fuel_Dash-v3.13.1.zip dist/Fuel_Dash-v3.13.1.zip.sha256 --target "$SHA" --title 'Fuel Dash v3.13.1' --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
