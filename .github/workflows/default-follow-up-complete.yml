name: Apply follow-up complete default

on:
  push:
    branches:
      - main
    paths:
      - .github/default-complete-request.txt

permissions:
  contents: write

concurrency:
  group: fuel-dash-default-complete
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Follow-up complete default on
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "note_transition_toggle.js",
              '''  function isComplete(type, noteId, completions = readObject(COMPLETE_KEY)) {
              if (!noteId) return false;
              const value = completions[completionKey(type, noteId)];
              return value === true || Boolean(value?.completedAt);
            }

            function setComplete(type, noteId, complete) {
              const id = String(noteId ?? "").trim();
              if (!id) return false;
              const values = readObject(COMPLETE_KEY);
              const key = completionKey(type, id);
              if (complete) values[key] = { completedAt: new Date().toISOString() };
              else delete values[key];
              return writeObject(COMPLETE_KEY, values);
            }''',
              '''  function isComplete(type, noteId, completions = readObject(COMPLETE_KEY)) {
              if (!noteId) return false;
              const key = completionKey(type, noteId);
              if (!Object.prototype.hasOwnProperty.call(completions, key)) return true;
              const value = completions[key];
              if (value === false || value?.complete === false) return false;
              return value === true || value?.complete === true || Boolean(value?.completedAt);
            }

            function setComplete(type, noteId, complete) {
              const id = String(noteId ?? "").trim();
              if (!id) return false;
              const values = readObject(COMPLETE_KEY);
              const key = completionKey(type, id);
              if (complete) values[key] = { complete: true, completedAt: new Date().toISOString() };
              else values[key] = { complete: false, completedAt: null };
              return writeObject(COMPLETE_KEY, values);
            }''',
          )

          replace_once(
              "worked_workflow.js",
              '''  function completionState(type, note, completions = readObject(COMPLETE_KEY)) {
              const noteId = String(note?.id ?? "").trim();
              if (!noteId) return { done: false, completedAt: null };
              const value = completions[noteStateKey(type, noteId)];
              const completedAt = value === true ? null : value?.completedAt || null;
              return { done: value === true || Boolean(completedAt), completedAt };
            }

            function setNoteComplete(type, noteId, complete) {
              const id = String(noteId ?? "").trim();
              if (!id) return false;
              const completions = readObject(COMPLETE_KEY);
              const key = noteStateKey(type, id);
              if (complete) completions[key] = { completedAt: new Date().toISOString() };
              else delete completions[key];
              const saved = writeObject(COMPLETE_KEY, completions);
              if (saved) renderWorkedView();
              return saved;
            }''',
              '''  function completionState(type, note, completions = readObject(COMPLETE_KEY)) {
              const noteId = String(note?.id ?? "").trim();
              if (!noteId) return { done: false, completedAt: null };
              const key = noteStateKey(type, noteId);
              if (!Object.prototype.hasOwnProperty.call(completions, key)) return { done: true, completedAt: null };
              const value = completions[key];
              if (value === false || value?.complete === false) return { done: false, completedAt: null };
              const completedAt = value === true ? null : value?.completedAt || null;
              return { done: value === true || value?.complete === true || Boolean(completedAt), completedAt };
            }

            function setNoteComplete(type, noteId, complete) {
              const id = String(noteId ?? "").trim();
              if (!id) return false;
              const completions = readObject(COMPLETE_KEY);
              const key = noteStateKey(type, id);
              if (complete) completions[key] = { complete: true, completedAt: new Date().toISOString() };
              else completions[key] = { complete: false, completedAt: null };
              const saved = writeObject(COMPLETE_KEY, completions);
              if (saved) renderWorkedView();
              return saved;
            }''',
          )

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if version != "3.9.0":
              raise SystemExit(f"Expected VERSION 3.9.0, found {version}")
          Path("VERSION").write_text("3.9.1\n", encoding="utf-8")

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check note_transition_toggle.js
          node --check worked_workflow.js
          grep -F 'if (!Object.prototype.hasOwnProperty.call(completions, key)) return true;' note_transition_toggle.js
          grep -F 'else values[key] = { complete: false, completedAt: null };' note_transition_toggle.js
          grep -F 'if (!Object.prototype.hasOwnProperty.call(completions, key)) return { done: true, completedAt: null };' worked_workflow.js
          grep -F 'else completions[key] = { complete: false, completedAt: null };' worked_workflow.js
          grep -F 'return selections[selectionKey(type, noteId)] === true;' note_transition_toggle.js
          test "$(tr -d '\r\n ' < VERSION)" = "3.9.1"

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'v3.9.1' > .github/default-complete-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note_transition_toggle.js worked_workflow.js VERSION .github/default-complete-result.txt
          git commit -m "Default follow-up completion to on"
          git push origin main
